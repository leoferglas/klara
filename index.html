<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Happy Birthday Klara</title>

  <style>
    body {
      margin: 0;
      font-family: system-ui, sans-serif;
      background: linear-gradient(135deg, #ff8fb1, #ff4f88);
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
      text-align: center;
    }

    /* TIMER oben rechts */
    #timer {
      position: fixed;
      top: 15px;
      right: 18px;
      font-size: 22px;
      font-weight: bold;
      background: rgba(255, 255, 255, 0.25);
      padding: 10px 14px;
      border-radius: 12px;
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px); /* wichtig für iPhone! */
    }

    .card {
      background: rgba(255,255,255,0.15);
      padding: 35px;
      border-radius: 15px;
      backdrop-filter: blur(8px);
      max-width: 500px;
    }

    #heart {
      font-size: 60px;
      margin-top: 20px;
      transition: transform 0.1s ease-out;
      user-select: none;
    }

    p {
      font-size: 18px;
      margin-bottom: 8px;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>Wische über das Herz!</h1>
    <div id="heart">❤️</div>
  </div>

  <script>
    /* -------------------------
       HERZ CODE (Wischen → wächst → platzt)
    ------------------------- */
    let heart = document.getElementById("heart");
    let size = 60;
    let targetSize = 160;

    function growHeart() {
      size += 5;
      heart.style.transform = `scale(${size/60})`;

      if (size >= targetSize) {
        setTimeout(() => {
          window.location.href = "geschenkauswahl.html";
        }, 700);
      }
    }

    // Touch für iPhone
    heart.addEventListener("touchstart", growHeart);
    heart.addEventListener("touchmove", growHeart);

    // Für Desktop-Test
    heart.addEventListener("mouseover", growHeart);
  </script>

</body>
</html>
``
