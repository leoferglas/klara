<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Überraschung 🎉</title>

  <style>
    body {
      margin: 0;
      font-family: system-ui, sans-serif;
      background: linear-gradient(135deg, #ffb6e6, #ff7ccf);
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      text-align: center;
    }
    .box {
      padding: 30px;
      border-radius: 15px;
      background: rgba(255,255,255,0.2);
      backdrop-filter: blur(10px);
    }
  </style>
</head>
<body>

  <div class="box">
    <h1>💗 Überraschung! 💗</h1>
    <p>Du hast das Herz platzen lassen…</p>
    <p>Und jetzt geht die Reise erst richtig los! 🌸✨</p>
  </div>

</body>
</html>
