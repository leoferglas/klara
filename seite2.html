<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Überraschung 🎉</title>

  <style>
    body {
      margin: 0;
      font-family: system-ui, sans-serif;
      background: linear-gradient(135deg, #b30000, #ff1a1a);
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      text-align: center;
      position: relative;
    }

    .box {
      padding: 30px;
      border-radius: 15px;
      background: rgba(255,255,255,0.2);
      backdrop-filter: blur(10px);
      max-width: 80%;
    }

    #timer {
      position: fixed;
      top: 15px;
      right: 18px;
      font-size: 22px;
      font-weight: bold;
      background: rgba(255, 255, 255, 0.25);
      padding: 10px 14px;
      border-radius: 12px;
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
    }

    .gift-box {
      position: fixed;
      padding: 12px 18px;
      background: rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(6px);
      border-radius: 12px;
      font-weight: bold;
      font-size: 18px;
      border: 1px solid rgba(255,255,255,0.35);
      cursor: pointer;
      user-select: none;
    }

    #gift1 {
      bottom: 20px;
      right: 20px;
    }

    #gift2 {
      bottom: 20px;
      left: 20px;
    }

    #gift3 {
      top: 20px;
      left: 20px;
    }
  </style>
</head>
<body>

  <div id="timer">59 Tage</div>

  <div class="box">
    <h1>💗 Alles Gute zum Geburtstag! 💗</h1>
    <p>Klicke auf die einzelnen Boxen!</p>
  </div>

  <div id="gift1" class="gift-box">Geschenk 1</div>
  <div id="gift2" class="gift-box">Geschenk 2</div>
  <div id="gift3" class="gift-box">Geschenk 3</div>

  <script>
    document.getElementById("gift1").addEventListener("click", () => {
      window.location.href = "code.html";  // Weiterleitung zur Code-Seite
    });

    const timerElement = document.getElementById("timer");
    const startDays = 59;

    function getToday() {
      let now = new Date();
      return new Date(now.getFullYear(), now.getMonth(), now.getDate());
    }

    if (!localStorage.getItem("timerStartDate")) {
      localStorage.setItem("timerStartDate", getToday().getTime());
    }

    function updateTimer() {
      const startDate = new Date(parseInt(localStorage.getItem("timerStartDate")));
      const today = getToday();

      const msPerDay = 1000 * 60 * 60 * 24;
      let pastDays = Math.floor((today - startDate) / msPerDay);

      let remaining = startDays - pastDays;
      if (remaining < 0) remaining = 0;

      timerElement.textContent = remaining + " Tage";
    }

    updateTimer();
    setInterval(updateTimer, 60000);
  </script>

</body>
</html>
