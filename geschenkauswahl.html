<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Überraschung 🎉</title>

  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --pink-light: #ff9a9e;
      --pink-mid: #fecfef;
      --pink-soft: #f6d5f7;
      --text-dark: #4a2c2c;
      --text-mid: #6b3a3a;
      --glass-bg: rgba(255, 255, 255, 0.35);
      --glass-border: rgba(255, 255, 255, 0.5);
      --shadow: 0 8px 32px rgba(180, 80, 100, 0.18);
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow-x: hidden;
    }

    body {
      font-family: 'Georgia', serif;
      background: linear-gradient(135deg, var(--pink-light), var(--pink-mid), var(--pink-soft));
      background-attachment: fixed;
      color: var(--text-dark);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100dvh;
      padding: clamp(16px, 5vw, 40px);
      text-align: center;
      gap: clamp(20px, 5vw, 40px);
    }

    /* Floating hearts background */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        radial-gradient(circle at 20% 20%, rgba(255,150,170,0.15) 0%, transparent 50%),
        radial-gradient(circle at 80% 80%, rgba(254,180,220,0.2) 0%, transparent 50%);
      pointer-events: none;
      z-index: 0;
    }

    .box {
      position: relative;
      z-index: 1;
      padding: clamp(20px, 6vw, 36px) clamp(18px, 6vw, 40px);
      border-radius: clamp(16px, 4vw, 24px);
      background: var(--glass-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      box-shadow: var(--shadow), inset 0 1px 0 var(--glass-border);
      border: 1px solid var(--glass-border);
      width: min(100%, 480px);
      animation: fadeSlideDown 0.7s ease both;
    }

    .box h1 {
      font-size: clamp(1.3rem, 6vw, 2rem);
      line-height: 1.3;
      font-weight: 700;
      letter-spacing: -0.01em;
      margin-bottom: clamp(8px, 2vw, 14px);
    }

    .box p {
      font-size: clamp(0.9rem, 3.5vw, 1.05rem);
      opacity: 0.75;
    }

    /* GESCHENK-CONTAINER */
    .gifts {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      gap: clamp(12px, 3vw, 16px);
      width: min(100%, 480px);
      animation: fadeSlideUp 0.7s 0.2s ease both;
    }

    .gift-box {
      padding: clamp(16px, 4.5vw, 22px) clamp(20px, 5vw, 30px);
      background: rgba(255, 255, 255, 0.42);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border-radius: clamp(12px, 3vw, 18px);
      font-weight: 700;
      font-size: clamp(1rem, 4.5vw, 1.2rem);
      border: 1px solid var(--glass-border);
      cursor: pointer;
      color: var(--text-mid);
      box-shadow: 0 4px 16px rgba(180, 80, 100, 0.12), inset 0 1px 0 rgba(255,255,255,0.6);
      transition: transform 0.2s ease, background 0.2s ease, box-shadow 0.2s ease;
      width: 100%;
      text-align: center;
      /* Large tap target for mobile */
      min-height: 58px;
      display: flex;
      align-items: center;
      justify-content: center;
      -webkit-tap-highlight-color: transparent;
    }

    .gift-box:hover,
    .gift-box:focus-visible {
      transform: scale(1.03) translateY(-2px);
      background: rgba(255,255,255,0.6);
      box-shadow: 0 8px 24px rgba(180, 80, 100, 0.2), inset 0 1px 0 rgba(255,255,255,0.7);
      outline: none;
    }

    .gift-box:active {
      transform: scale(0.97);
      background: rgba(255,255,255,0.5);
    }

    /* Animations */
    @keyframes fadeSlideDown {
      from { opacity: 0; transform: translateY(-24px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeSlideUp {
      from { opacity: 0; transform: translateY(24px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* Safe area support (iPhone notch / home bar) */
    body {
      padding-bottom: max(clamp(16px, 5vw, 40px), env(safe-area-inset-bottom));
      padding-top: max(clamp(16px, 5vw, 40px), env(safe-area-inset-top));
      padding-left: max(clamp(16px, 5vw, 40px), env(safe-area-inset-left));
      padding-right: max(clamp(16px, 5vw, 40px), env(safe-area-inset-right));
    }

    /* Landscape orientation on mobile */
    @media (max-height: 500px) and (orientation: landscape) {
      body {
        justify-content: flex-start;
        padding-top: 16px;
        gap: 12px;
      }

      .box h1 { font-size: 1.1rem; }
      .box p   { font-size: 0.82rem; }

      .gift-box {
        min-height: 44px;
        padding: 10px 20px;
        font-size: 0.95rem;
      }

      .gifts {
        flex-direction: row;
        flex-wrap: wrap;
      }

      .gift-box {
        flex: 1 1 calc(33% - 8px);
      }
    }
  </style>
</head>
<body>

  <div class="box">
    <h1>❤️ Alles Gute zum Geburtstag! ❤️</h1>
    <p>Klicke auf die einzelnen Boxen!</p>
  </div>

  <div class="gifts">
    <div id="gift1" class="gift-box" role="button" tabindex="0">🎁 Geschenk 1</div>
    <div id="gift2" class="gift-box" role="button" tabindex="0">🎁 Geschenk 2</div>
    <div id="gift3" class="gift-box" role="button" tabindex="0">🎁 Geschenk 3</div>
  </div>

  <script>
    function navigate(id, url) {
      const el = document.getElementById(id);
      const go = () => window.location.href = url;
      el.addEventListener("click", go);
      el.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") go(); });
    }

    navigate("gift1", "code.html");
    navigate("gift2", "geschenk2.html");
    navigate("gift3", "geschenk3.html");
  </script>

</body>
</html>
