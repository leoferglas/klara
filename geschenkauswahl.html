<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Überraschung 🎉</title>

  <style>
    body {
      margin: 0;
      font-family: system-ui, sans-serif;
      background: linear-gradient(135deg, #ff9a9e, #fecfef, #f6d5f7);
      /* Romantische Pastell-Farbkombination */
      color: #4a2c2c;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      align-items: center;
      padding-top: 80px;
      height: 100vh;
      text-align: center;
    }

    .box {
      padding: 30px;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.35);
      backdrop-filter: blur(10px);
      box-shadow: 0 5px 20px rgba(0,0,0,0.15);
      max-width: 80%;
      margin-bottom: 40px;
    }
    /* GESCHENK-CONTAINER */
    .gifts {
      display: flex;
      gap: 10px;
      justify-content: center;
    }

    .gift-box {
      padding: 18px 25px;
      background: rgba(255, 255, 255, 0.4);
      backdrop-filter: blur(6px);
      border-radius: 15px;
      font-weight: bold;
      font-size: 20px;
      border: 1px solid rgba(255, 255, 255, 0.35);
      cursor: pointer;
      transition: 0.25s;
      color: #6b3a3a;
      box-shadow: 0 3px 10px rgba(0,0,0,0.1);
    }

    .gift-box:hover {
      transform: scale(1.07);
      background: rgba(255,255,255,0.55);
    }
  </style>
</head>
<body>

  <div class="box">
    <h1>❤️ Alles Gute zum Geburtstag! ❤️</h1>
    <p>Klicke auf die einzelnen Boxen!</p>
  </div>

  <!-- Zwei Geschenke nebeneinander -->
  <div class="gifts">
    <div id="gift1" class="gift-box">Geschenk 1</div>
    <div id="gift2" class="gift-box">Geschenk 2</div>
    <div id="gift3" class="gift-box">Geschenk 3</div>
  </div>

  <script>
    document.getElementById("gift1").addEventListener("click", () => {
      window.location.href = "code.html"; 
    });

    document.getElementById("gift2").addEventListener("click", () => {
      window.location.href = "geschenk2.html"; 
    });

    document.getElementById("gift3").addEventListener("click", () => {
      window.location.href = "geschenk3.html"; 
    });
  </script>

</body>
</html>
