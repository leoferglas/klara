<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Code-Eingabe</title>

  <style>
    body {
      background: linear-gradient(135deg, #9500b3, #ff1a1a);
      color: white;
      font-family: system-ui, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      text-align: center;
    }

    .box {
      background: rgba(255, 255, 255, 0.25);
      padding: 30px;
      border-radius: 15px;
      backdrop-filter: blur(8px);
    }

    input {
      padding: 10px;
      border-radius: 10px;
      border: none;
      width: 180px;
      font-size: 18px;
      text-align: center;
      margin-top: 10px;
    }

    button {
      margin-top: 15px;
      padding: 10px 20px;
      border-radius: 10px;
      border: none;
      background: white;
      color: #000000;
      font-size: 18px;
      cursor: pointer;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div class="box">
    <h2>🔐 Code erforderlich 🔐</h2>
    <p>Gib die Zahlenfolge des Tages ein,<br> an dem wir zusammengekommen sind.</p>

    <input type="text" id="codeInput" placeholder="DDMMYYYY" maxlength="8">

    <button onclick="checkCode()">Bestätigen</button>

    <p id="error" style="color: yellow; margin-top: 12px;"></p>
  </div>

  <script>
    const correctCode = "21022026";

    function checkCode() {
      const input = document.getElementById("codeInput").value;
      const error = document.getElementById("error");

      if (input === correctCode) {
        window.location.href = "geschenk1.html";
      } else {
        error.textContent = "Bissl Peinlich 😂";
      }
    }
  </script>

</body>
</html>
