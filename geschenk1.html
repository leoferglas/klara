<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Geschenk 1</title>

  <style>
    /* Reset & sane defaults */
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }

    :root{
      /* Grundabstände */
      --page-padding: 20px;
      --gap: 20px;
      --box-radius: 16px;
    }

    body {
      /* iOS-geeignete volle Höhe inkl. dynamischer Viewport-Höhe */
      min-height: 100dvh;
      /* Safe-Area für iPhones mit Notch/Kinn */
      padding:
        calc(var(--page-padding) + env(safe-area-inset-top))
        calc(var(--page-padding) + env(safe-area-inset-right))
        calc(var(--page-padding) + env(safe-area-inset-bottom))
        calc(var(--page-padding) + env(safe-area-inset-left));

      /* Hintergrund */
      background: linear-gradient(135deg, #9500b3, #ff1a1a);

      /* Vertikale Anordnung */
      display: flex;
      flex-direction: column;
      align-items: center;   /* horizontal zentriert */
      justify-content: center; /* vertikal zentriert */
      gap: var(--gap);

      font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
      color: #fff;
      text-align: center;
    }

    /* Inhaltliche Box */
    .box {
      background: rgba(255, 255, 255, 0.22);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px); /* iOS */
      border-radius: var(--box-radius);

      width: 100%;
      max-width: 420px;   /* auf iPhone 14 bleibt es angenehm schmal */
      padding: 28px 24px;

      /* leichte Tiefe */
      box-shadow: 0 10px 30px rgba(0,0,0,0.25), inset 0 1px 0 rgba(255,255,255,0.15);
    }

    .box h1 {
      margin: 0 0 12px 0;
      font-size: clamp(22px, 5.5vw, 32px); /* responsive */
      line-height: 1.2;
    }

    .box p {
      margin: 0;
      font-size: clamp(16px, 4.4vw, 18px);
      line-height: 1.45;
    }

    /* Der "Zurück"-Bereich liegt als eigener Block unter der Box */
    .back {
      width: 100%;
      max-width: 420px;
      font-size: 16px;
    }

    .back a {
      display: inline-block;
      color: #fff;
      text-decoration: underline;
      text-underline-offset: 3px;
      /* etwas „Touch“-Fläche */
      padding: 8px 10px;
      border-radius: 8px;
    }

    /* Optional: leichtes Hover/Active-Feedback (auch für iOS sinnvoll) */
    .back a:active { opacity: 0.8; }

    /* Kleiner Sicherheitsabstand am unteren Rand, falls die Tastleiste eingeblendet wird */
    @supports (padding: max(0px)) {
      body { padding-bottom: max(var(--page-padding), env(safe-area-inset-bottom)); }
    }
  </style>
</head>
<body>

  <div class="box">
    <h1>✉️🌹 1. Geschenk 🌹✉️</h1>
    <p>❤️ Dein 1. Geschenk findest du im Briefkasten ❤️</p>
  </div>

  <div class="back">
    <a href="geschenkauswahl.html">⬅ Zurück zur Geschenkauswahl</a>
  </div>

</body>
</html>
