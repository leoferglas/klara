<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dein 3. Geschenk</title>

  <style>
    body {
      margin: 0;
      font-family: system-ui, sans-serif;
      background: linear-gradient(135deg, #ff9a9e, #fecfef, #f6d5f7);
      background-size: 200% 200%;
      animation: bgShift 12s ease infinite;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      text-align: center;
      color: #4a2c2c;
    }

    @keyframes bgShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .wrapper {
      max-width: 800px;
      width: 100%;
    }

    .title-box {
      background: rgba(255, 255, 255, 0.35);
      padding: 25px;
      border-radius: 18px;
      backdrop-filter: blur(10px);
      margin-bottom: 35px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.15);
    }

    .card-scene {
      width: 280px;
      height: 410px;
      perspective: 1000px;
      margin: 0 auto;
    }

    .card {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.8s ease;
      border-radius: 16px;
      cursor: pointer;
      box-shadow: 0 12px 30px rgba(0,0,0,0.2);
    }

    .card.flipped {
      transform: rotateY(180deg);
      cursor: default;
    }

    .card-face {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      border-radius: 16px;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .card-back {
      background: linear-gradient(135deg, #ffc1cc, #ffd6e8);
      font-size: 70px;
    }

    .card-front {
      transform: rotateY(180deg);
      background: white;
      color: #4a2c2c;
      font-size: 20px;
      padding: 25px;
      line-height: 1.4;
      font-weight: 600;
    }

    button {
      margin-top: 25px;
      padding: 12px 20px;
      background: white;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 5px 15px rgba(0,0,0,0.15);
      transition: 0.2s;
    }

    button:hover {
      background: #fff5f7;
      transform: translateY(-2px);
    }

    a.back {
      display: inline-block;
      margin-top: 18px;
      color: #4a2c2c;
      text-decoration: underline;
      font-weight: bold;
    }

    a.back:hover {
      text-decoration: underline;
    }
  </style>
</head>

<body>

  <div class="wrapper">

    <div class="title-box">
      <h1>🎁 Dein 2. Geschenk</h1>
      <p>Ziehe eine Karte.</p>
    </div>

    <div class="card-scene">
      <div class="card" id="card">
        <div class="card-face card-back">💌</div>

        <div class="card-face card-front" id="message">
            DATE! <br> Zieh dich schick an! 💃 <br>
          Wir gehen am Samstag, den 21.03. zum
          DONELLO am Yachthafen - Speyer 🤵
        </div>
      </div>
    </div>

    <button id="draw">Karte ziehen</button>

    <br>
    <a class="back" href="geschenkauswahl.html">⬅ Zurück zur Geschenkauswahl</a>

  </div>

  <script>
    const card = document.getElementById("card");
    const drawBtn = document.getElementById("draw");

    drawBtn.addEventListener("click", () => {
      card.classList.add("flipped");
      drawBtn.disabled = true;
      drawBtn.style.opacity = 0.4;
      drawBtn.style.cursor = "default";
    });

    // Karte selbst nur einmal klickbar
    card.addEventListener("click", () => {
      if (!card.classList.contains("flipped")) {
        card.classList.add("flipped");
        drawBtn.disabled = true;
        drawBtn.style.opacity = 0.4;
      }
    });
  </script>

</body>
</html>
